spring:
  application:
    name: sneaker-wishlist-backend
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${POSTGRES_DB:sneaker_wishlist}
    username: ${POSTGRES_USER:sneaker_wishlist}
    password: ${POSTGRES_PASSWORD:changeme}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true

app:
  price-check:
    cron: "0 0 14 * * *"
  kicksdb:
    api-key: ${KICKSDB_API_KEY:}
    base-url: ${KICKSDB_BASE_URL:https://api.kicks.dev}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173}
